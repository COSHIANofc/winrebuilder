name: Release
on:
  push:
    tags: ['v.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate tag and version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          if ($env:TAG_NAME -ne $props.Project.PropertyGroup.InformationalVersion) { throw 'Tag does not match the public version.' }
          if ($props.Project.PropertyGroup.Version -ne '0.3.1.1' -or $props.Project.PropertyGroup.AssemblyVersion -ne '0.3.1.1' -or $props.Project.PropertyGroup.FileVersion -ne '0.3.1.1') { throw 'Internal version mismatch.' }
      - run: dotnet restore WinRebuilder.slnx
      - run: dotnet build WinRebuilder.slnx --no-restore -c Release
      - run: dotnet test WinRebuilder.slnx --no-build -c Release
      - name: Check release source contract
        shell: pwsh
        run: |
          if (Test-Path src/WinRebuilder.Cli) { throw 'CLI project remains.' }
          if (Test-Path packaging/wrb.cmd) { throw 'CLI alias remains.' }
          if (-not (Test-Path config.yml) -or -not (Test-Path config.example.yml)) { throw 'Configuration files missing.' }
  release:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Measure, publish, and package
        shell: pwsh
        run: ./packaging/Build-Release.ps1
      - name: Create prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG_NAME --json id 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite historical assets.' }
          gh release create $env:TAG_NAME release-assets/WinRebuilder.zip release-assets/WinRebuilder-portable.exe --verify-tag --title "WinRebuilder $env:TAG_NAME" --notes-file .github/release-notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG_NAME" | ConvertFrom-Json
          if (-not $release.prerelease -or -not $release.zipball_url -or -not $release.tarball_url) { throw 'Prerelease or GitHub source archives missing.' }
          $names = @($release.assets | ForEach-Object name | Sort-Object)
          if ($names.Count -ne 2 -or $names -notcontains 'WinRebuilder-portable.exe' -or $names -notcontains 'WinRebuilder.zip') { throw 'Visible uploaded release assets differ from the required two files.' }
