name: Build
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WinRebuilder.slnx
      - run: dotnet build src/WinRebuilder.Core/WinRebuilder.Core.csproj --no-restore
      - run: dotnet test tests/WinRebuilder.Core.Tests/WinRebuilder.Core.Tests.csproj --no-restore
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WinRebuilder.slnx
      - run: dotnet build WinRebuilder.slnx --no-restore
      # Adapter tests use fake winget processes; no package installation runs in CI.
      - run: dotnet test tests/WinRebuilder.Core.Tests/WinRebuilder.Core.Tests.csproj --no-build
      - run: dotnet test tests/WinRebuilder.Windows.Tests/WinRebuilder.Windows.Tests.csproj --no-build
      - run: dotnet test tests/WinRebuilder.UI.Tests/WinRebuilder.UI.Tests.csproj --no-build
      - name: Publish and launch GUI without modifying machine state
        shell: pwsh
        run: |
          dotnet publish src/WinRebuilder.UI/WinRebuilder.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -o ui-sanity
          if ($LASTEXITCODE -ne 0) { throw 'GUI publish failed.' }
          ./packaging/Test-Startup.ps1 ui-sanity/WinRebuilder.exe
